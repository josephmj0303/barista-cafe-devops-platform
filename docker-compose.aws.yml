services:
  backend:
    image: josephmj0303/barista-cafe-backend:latest
    container_name: barista-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 5000
      LOG_LEVEL: INFO
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: josephmj0303/barista-cafe-frontend:latest
    container_name: barista-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
