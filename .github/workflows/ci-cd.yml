name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  BACKEND_IMAGE: josephmj0303/barista-cafe-backend
  FRONTEND_IMAGE: josephmj0303/barista-cafe-frontend
  AWS_REGION: us-east-1

jobs:

  test-and-scan:
    name: Test and Security Scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: barista
          POSTGRES_PASSWORD: barista-dev-password
          POSTGRES_DB: barista
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U barista -d barista"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://barista:barista-dev-password@localhost:5432/barista
        run: |
          pytest -q backend/tests

      - name: Scan Python dependencies
        working-directory: backend
        run: |
          pip-audit -r requirements.txt

      - name: Validate backend syntax
        run: |
          python -m py_compile backend/app.py

      - name: Validate Docker Compose
        run: |
          docker compose -f docker-compose.yml config -q

      - name: Build backend image
        run: |
          docker build \
            --tag ${BACKEND_IMAGE}:ci \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --tag ${FRONTEND_IMAGE}:ci \
            ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Test Slack failure notification
        run: exit 1

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  build-and-push:
    name: Build and Push Images
    needs:
      - test-and-scan
      - terraform
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy-staging:
    name: Deploy Staging
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -input=false

      - name: Get infrastructure outputs
        working-directory: terraform
        run: |
          echo "APP_INSTANCE_ID=$(terraform output -raw app_instance_id)" >> "$GITHUB_ENV"
          echo "MONITORING_INSTANCE_ID=$(terraform output -raw monitoring_instance_id)" >> "$GITHUB_ENV"
          echo "ALB_DNS_NAME=$(terraform output -raw alb_dns_name)" >> "$GITHUB_ENV"
          echo "RDS_ENDPOINT=$(terraform output -raw rds_endpoint)" >> "$GITHUB_ENV"

      - name: Make deployment scripts executable
        run: |
          chmod +x deployment/app/deploy-app.sh
          chmod +x deployment/monitoring/deploy-monitoring.sh

      - name: Deploy application
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          ./deployment/app/deploy-app.sh \
            "$APP_INSTANCE_ID" \
            "$RDS_ENDPOINT" \
            "$DB_PASSWORD"

      - name: Deploy monitoring
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          ./deployment/monitoring/deploy-monitoring.sh \
            "$MONITORING_INSTANCE_ID" \
            "$RDS_ENDPOINT" \
            "$ALB_DNS_NAME" \
            "$DB_PASSWORD"

  deploy-production:
    name: Deploy Production
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -input=false

      - name: Get infrastructure outputs
        working-directory: terraform
        run: |
          echo "APP_INSTANCE_ID=$(terraform output -raw app_instance_id)" >> "$GITHUB_ENV"
          echo "RDS_ENDPOINT=$(terraform output -raw rds_endpoint)" >> "$GITHUB_ENV"

      - name: Make deployment script executable
        run: |
          chmod +x deployment/app/deploy-app.sh

      - name: Deploy application
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          ./deployment/app/deploy-app.sh \
            "$APP_INSTANCE_ID" \
            "$RDS_ENDPOINT" \
            "$DB_PASSWORD"

  notify-failure:
    name: Notify Slack on Failure
    needs:
      - test-and-scan
      - terraform
      - build-and-push
      - deploy-staging
      - deploy-production
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest

    steps:
      - name: Send Slack failure notification
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: |
              🚨 Barista Cafe CI/CD Pipeline Failed

              Repository: ${{ github.repository }}
              Branch: ${{ github.ref_name }}
              Workflow: ${{ github.workflow }}
              Run: ${{ github.run_number }}
              Commit: ${{ github.sha }}

              Check GitHub Actions for the failed job.
