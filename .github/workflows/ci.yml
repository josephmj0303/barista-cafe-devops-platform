name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate and build Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit

      - name: Run backend tests
        run: |
          pytest -q backend/tests

      - name: Scan Python dependencies
        working-directory: backend
        run: |
          pip-audit -r requirements.txt

      - name: Validate backend Python syntax
        run: |
          python -m py_compile backend/app.py

      - name: Validate Docker Compose configuration
        run: |
          docker compose config -q

      - name: Build backend Docker image
        run: |
          docker build \
            --tag barista-backend:ci \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            --tag barista-frontend:ci \
            ./frontend

      - name: Scan backend container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: barista-backend:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: barista-frontend:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  validate-terraform:
    name: Validate Terraform configuration
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: |
          terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init -backend=false

      - name: Terraform validate
        run: |
          terraform validate
